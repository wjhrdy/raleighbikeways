name: Refresh greenway alerts

on:
  schedule:
    # 03:17 EST / 04:17 EDT; avoid the busy top of the hour.
    - cron: '17 8 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/fetch_greenway_alerts.py'
      - 'tests/test_greenway_alerts.py'
      - '.github/workflows/greenway-alerts.yml'

permissions:
  contents: read

concurrency:
  group: greenway-alerts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_greenway_alerts.py' -v

  refresh:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate published Greenways alerts
        run: python scripts/fetch_greenway_alerts.py
      - name: Commit snapshot
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/greenway-alerts.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh Raleigh greenway alerts'
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
